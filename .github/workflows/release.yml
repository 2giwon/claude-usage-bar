# v0.1.0 같은 버전 태그를 올리면 메뉴 막대 앱 Claude Usage Bar 를 빌드해서 GitHub Releases 에 zip 으로 올린다
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@v4

      - name: Check calculations
        run: make check

      - name: Build universal app and zip
        run: make zip VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "ClaudeUsageBar-${VERSION}.zip" \
            --title "Claude Usage Bar ${VERSION}" \
            --notes "메뉴 막대 앱 Claude Usage Bar ${VERSION}. 설치 방법은 README 의 다운로드 부분을 보세요. Claude Code 쪽 mod(usage-bar-for-claude)도 함께 설치해야 값이 나와요."
